<!DOCTYPE html>
<!-- HTML5 문서 선언: 브라우저에게 최신 표준 모드로 해석하라고 알린다 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 반응형 필수: 페이지 너비를 기기 화면 너비에 맞춘다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B1-1 포트폴리오</title>
  <!-- 표현(CSS)은 구조(HTML)와 섞지 않고 외부 파일로 연결한다 -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- 테마 선주입: 그리기 전에 저장된 테마를 html에 붙여 흰 번쩍임(FOUC)을 막는다.
       본문(main.js)보다 먼저 실행되어야 해서 head에 직접 둔다. -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('user-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (systemDark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>
  <!-- 동작(JS)도 분리한다. defer는 HTML 해석을 막지 않고,
       해석이 끝난 뒤 순서대로 실행하라는 뜻이다 -->
  <script src="js/main.js" defer></script>
</head>
<body>
  <header id="top">
    <button type="button" id="menu-button">메뉴</button>
    <button type="button" id="theme-toggle">다크 모드</button>
    <nav>
      <a href="#about">소개</a>
      <a href="#tech">기술</a>
      <a href="#project">프로젝트</a>
      <a href="#contact">문의</a>
    </nav>
  </header>
  <main>
    <section id="hero">
      <h1>안녕하세요, sarguments입니다.</h1>
      <p>외부 라이브러리 없이 HTML·CSS·JS만으로 만드는 포트폴리오입니다.</p>
    </section>
    <section id="about" class="reveal">
      <h2>기록하고 다시 재현하는 걸 좋아합니다.</h2>
      <p>지금은 B1-1 미션 진행 중입니다.</p>
      <img src="images/profile.svg" alt="sarguments 프로필 사진" />
    </section>
    <section id="tech" class="reveal">
      <h2>기술</h2>
      <ul>
        <li>HTML — 시맨틱 구조</li>
        <li>CSS — 반응형·다크모드</li>
        <li>JavaScript — 상태와 렌더링</li>
        <li>Git·GitHub — 기록과 배포</li>
      </ul>
    </section>
    <section id="project" class="reveal">
      <h2>프로젝트</h2>
      <article>
        <p>GitHub 저장소 목록이 여기에 표시됩니다.</p>
      </article>
    </section>
    <section id="contact" class="reveal">
      <h2>문의</h2>
      <form>
        <label for="contact-name">이름</label>
        <input type="text" id="contact-name" name="name" required />
        <p id="name-error"></p>
        <label for="contact-email">이메일</label>
        <input type="email" id="contact-email" name="email" required />
        <p id="email-error"></p>
        <label for="contact-message">메시지</label>
        <textarea id="contact-message" name="message" required></textarea>
        <p id="message-error"></p>
        <button type="submit">보내기</button>
        <p id="form-result"></p>
      </form>
    </section>    
  </main>
  <!-- 맨 위로 버튼: 300px 이상 내리면 보인다. 동작은 main.js가 맡는다. -->
  <button type="button" id="top-button">위로</button>
  <footer>
    <div>© sarguments · 외부 라이브러리 없이 제작</div>
    <a href="#top">맨 위로</a>
  </footer>
</body>
</html>
