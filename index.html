<!DOCTYPE html>
<!-- HTML5 문서 선언: 브라우저에게 최신 표준 모드로 해석하라고 알린다 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 반응형 필수: 페이지 너비를 기기 화면 너비에 맞춘다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B1-1 포트폴리오</title>
  <!-- 표현(CSS)은 구조(HTML)와 섞지 않고 외부 파일로 연결한다 -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- 동작(JS)도 분리한다. defer는 HTML 해석을 막지 않고,
       해석이 끝난 뒤 순서대로 실행하라는 뜻이다 -->
  <script src="js/main.js" defer></script>
</head>
<body>
  <h1>B1-1 포트폴리오</h1>
  <p>지금은 빈 골격이다. 각 섹션은 이후 작업에서 채운다.</p>
</body>
</html>
